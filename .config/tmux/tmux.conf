set -g prefix C-e
set-option -g default-shell /opt/homebrew/bin/fish

unbind-key C-b
unbind-key t
bind-key C-e send-prefix

unbind r  # Unbind previous r key
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
# Set 256 colors
# TODO: maybe windows?
#set -s default-terminal 'screen-256color'
set -g default-terminal 'tmux-256color'
set -g renumber-windows on 
set -g set-clipboard on
set -g base-index 1
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}"
setw -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'


set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

set -g @catppuccin_status_modules_right "directory date_time session battery"

set -g @catppuccin_battery_icon "#{?#{==:#{battery_percentage},100%},󱟢,#{?#{>=:#{battery_percentage},80%},󰂂,#{?#{>=:#{battery_percentage},60%},󰂀,#{?#{>=:#{battery_percentage},40%},󰁾,#{?#{>=:#{battery_percentage},20%},󰁻,󰁺}}}}}"
set -g @catppuccin_battery_text "#{?#{battery_plugged},󰚥,#{battery_percentage}}"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text "%H:%M"

set -g status-position top

bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default
